[package]
name = "mimic"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "A compact TinyTask-style input recorder and player for KDE Plasma on Wayland"
license = "MIT"
keywords = ["macro", "automation", "wayland", "kde", "input"]
categories = ["gui", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "mimic"
path = "src/main.rs"

[dependencies]
ashpd = { version = "0.14", default-features = false, features = ["global_shortcuts", "tokio"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland"] }
evdev = "0.13.2"
futures-util = "0.3"
nix = { version = "0.29", features = ["fs", "poll", "user"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
zbus = { version = "6", default-features = false, features = ["proxy", "service", "tokio"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
